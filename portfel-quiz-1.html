<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курс «Портфель». Квиз 1</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mut:#6b7488;--ac:#1f5eff;--acs:#e8eeff;--bd:#dde2ee;--ok:#12a36b;--oks:#e3f6ed;--bad:#d9434f;--bads:#fdeaec;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182033;--tx:#e8ecf5;--mut:#98a3bb;--ac:#6c93ff;--acs:#22304f;--bd:#2c3650;--ok:#3ecf94;--oks:#143327;--bad:#ff6b76;--bads:#3a1d24}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182033;--tx:#e8ecf5;--mut:#98a3bb;--ac:#6c93ff;--acs:#22304f;--bd:#2c3650;--ok:#3ecf94;--oks:#143327;--bad:#ff6b76;--bads:#3a1d24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:#243e90;color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
.top .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:16px}
.top img{display:block;width:92px;height:auto;flex:none}
.top .lbl{font-size:13px;letter-spacing:.14em;opacity:.9}.top .ttl{font-size:20px;font-weight:700;margin-top:4px;line-height:1.25}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
h1{font-size:26px;line-height:1.2;margin:0 0 10px}h2{font-size:19px;line-height:1.35;margin:0 0 16px}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:14px}
.bar{height:6px;background:var(--bd);border-radius:6px;margin:6px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac);background:var(--acs)}
.opt:disabled{cursor:default}.opt.dim{opacity:.55}
.opt.ok{border-color:var(--ok);background:var(--oks);opacity:1}.opt.bad{border-color:var(--bad);background:var(--bads);opacity:1}
.fb{border-radius:12px;padding:14px 16px;margin-top:6px}.fb.ok{background:var(--oks)}.fb.bad{background:var(--bads)}
.fb b{display:block;margin-bottom:8px}.fb p:last-child{margin-bottom:0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:600 16px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.big{font-size:44px;font-weight:700;color:var(--ac);line-height:1.1;margin:6px 0 10px}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>

<script>
var Q=[{"q": "Какой вид экономики развивается на ближайшие несколько лет в мире?", "o": ["Технологическая экономика", "Индустриальная экономика", "Ресурсная экономика", "Социальная экономика"], "c": 2, "e": "Из-за нарастания военных конфликтов, ограничений традиционных логистических путей и развития ИИ, требующего повышенного энергопотребления, глобальная экономика переходит к нехватке базовых ресурсов.\n\nТакая экономика называется ресурсной. Важное значение приобретают нефтегаз, металлы, электроэнергия, химия, удобрения, продовольствие, водные ресурсы."}, {"q": "Что будет происходить на фондовых рынках в ближайшие несколько лет?", "o": ["Активный период IPO", "Продолжится гегемония технологических компаний", "Переход к перевесу защитных акций", "Сжатие бенефициаров и выбора эмитентов"], "c": 3, "e": "Нестабильные цены на ресурсы, увеличение страховых рисков, сжатие потребления приводит к повышенным рискам банкротств, консолидации бизнеса.\n\nЭто, в свою очередь, провоцирует сжатие количества надежных эмитентов. Новый бизнес развивается в условиях снижения доступа к инвестициям.\n\nИнвесторы не готовы брать на себя повышенный риск.\n\nТаким образом, выбор надежных эмитентов может быть ограничен. В этих условиях важно создавать внутренний денежный поток портфелей, а не широкую диверсификацию."}, {"q": "Выберите инвестиционный концепт, который не теряет актуальность?", "o": ["ESG повестка", "Антиинфляционные активы", "Валютные портфели", "Пассивные дивидендные стратегии"], "c": 1, "e": "Упор на антиинфляционные активы - недвижимость, бизнес, базовые активы - остается актуальным как никогда.\n\nДанный концепт работает на росте рынков, в условиях сжатия спроса, в кризис и помогает делать ставку на наиболее растущие активы."}, {"q": "Какой вид портфеля из традиционных концептов все еще остается рабочим в текущих реалиях?", "o": ["Всепогодные виды портфелей", "Пассивный дивидендный", "Технологический", "Портфели широкого рынка"], "c": 0, "e": "Всепогодные портфели остаются рабочими в условиях быстро меняющихся логистических путей, нехватки ресурсов.\n\nОни дают разумную диверсификацию отраслей и широкую ставку на базовые активы, защитные и доходные акции."}, {"q": "Определите базовую стратегию для создания капитала?", "o": ["Экономия расходов", "Больше зарабатывать", "Покупать только доходные активы", "Концепт нулевого бюджета"], "c": 3, "e": "Деньги, которые не имеют цели, имеют высокий риск быть потраченными «вникуда».\n\nПоэтому мы все доходы распределяем «под ноль» на текущие расходы, резервы на годовые расходы и покупку антиинфляционных и доходных активов.\n\nПри этом мы не стремимся к тотальной экономии. Важно в текущих расходах и годовых резервах выделять достаточно средств на развлечения, отпуска и, возможно, иметь определенный резерв «бесцельных» денег. Но все резервы должны быть определены и разумно ограничены.\n\nМы не покупаем будущее в ущерб настоящему."}, {"q": "Какую стратегию создания активов мы выбираем при низком доходе?", "o": ["Взять льготную ипотеку", "Создавать капитал за счет инвестиций в доходные акции и облигации", "Больше экономить", "Делать упор на антиинфляционные активы"], "c": 1, "e": "Недвижимость - отличный антиинфляционный актив.\n\nОднако доходность недвижимости ниже, чем фондового рынка в большинстве случаев. Также недвижимость требует расходов, ремонта и трудозатрат по управлению для повышения доходности.\n\nПоэтому в условиях низкого дохода [когда ипотечный платеж более 30% от регулярных доходов] вложения в облигации, дивидендные акции имеют более быстрый срок достижения финансовых целей."}, {"q": "Как обычно ведет себя «жертва» на рынке?", "o": ["Активно докупает на снижениях", "Долго пересиживает убытки", "Часто продает в убыток «на дне» или в минимальный плюс", "Часто продает в минимальный убыток"], "c": 1, "e": "«Жертва» любит долго пересиживать убытки. Часто продает в убыток «на дне», боится докупать на снижениях.\n\nНаиболее близка к профилю «спасателя», однако главное отличие - быстрота реакции.\n\nЖертва обычно ждет дольше в надежде на выход в плюс. «Спасатель» действует быстрее и часто находится около нуля.\n\nКак итог, «жертва» завышает риски при низкой доходности. А «спасатель» имеет низкий риск, но и низкую доходность."}, {"q": "Как можно использовать фонды в инвестициях?", "o": ["Держать фонды в долгосрок", "Покупать фонды широкого рынка", "Инвестировать только в фонды на облигации", "Покупать фонды под определенную идею или после сильных снижений общего рынка на возврат к росту"], "c": 3, "e": "Инвестировать в фонды в долгосрок не имеет смысла, поскольку мы берём на себя риск одного эмитента - создателя самого фонда. А всеми активами владеет именно фонд, а не инвестор.\n\nФонды на облигации имеют смысл для нерезидентов из-за дороговизны лотов на облигации.\n\nВ РФ облигации стоят недорого. И есть смысл диверсифицировать эмитентов облигаций и получать прямой пассивный доход.\n\nМы покупаем фонды смешанного состава под идею или после сильного снижения общего рынка, как было в 2020 или 2022. Здесь смысл - поймать отскок общего рынка после существенного снижения всего рынка."}];
var app=document.getElementById("app"),i=0,score=0;
var cv=document.getElementById("cf"),cx=cv.getContext("2d"),P=[],raf=0;
function confetti(){
 if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 cv.width=innerWidth;cv.height=innerHeight;
 var cols=["#243e90","#6c93ff","#f5b700","#12a36b","#ff5d73","#9b6bff"];
 for(var k=0;k<150;k++)P.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.5,vx:(Math.random()-.5)*16,vy:-Math.random()*17-6,w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[k%cols.length],t:0});
 if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 P=P.filter(function(p){p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.t++;return p.y<innerHeight+30&&p.t<240});
 P.forEach(function(p){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
 raf=P.length?requestAnimationFrame(tick):0;
}
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstElementChild}
function show(n){app.innerHTML="";app.appendChild(n);window.scrollTo(0,0)}
function paras(box,t){t.split("\n\n").forEach(function(s){var p=document.createElement("p");p.textContent=s;box.appendChild(p)})}
function intro(){
 var n=el('<div class="card"><h1>Квиз 1</h1><p>8 вопросов по курсу «Портфель». После каждого ответа вы увидите правильный вариант и пояснение. За верный ответ вас ждет сюрприз.</p><div class="row"><button class="btn" id="go">Начать</button></div></div>');
 show(n);n.querySelector("#go").onclick=function(){i=0;score=0;ask()};
}
function ask(){
 var q=Q[i],n=el('<div class="card"><div class="mut">Вопрос '+(i+1)+' из '+Q.length+'</div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><h2></h2><div id="o"></div><div id="fb"></div></div>');
 n.querySelector("h2").textContent=q.q;
 var o=n.querySelector("#o"),btns=[];
 q.o.forEach(function(t,k){var b=document.createElement("button");b.className="opt";b.textContent=t;btns.push(b);
  b.onclick=function(){
   var good=k===q.c;if(good)score++;
   btns.forEach(function(x,j){x.disabled=true;if(j===q.c)x.classList.add("ok");else if(j===k)x.classList.add("bad");else x.classList.add("dim")});
   var fb=el('<div class="fb '+(good?"ok":"bad")+'"><b>'+(good?"Верно! 🎉":"Не совсем")+'</b></div>');
   paras(fb,q.e);n.querySelector("#fb").appendChild(fb);
   var nx=el('<div class="row"><button class="btn"></button></div>');
   nx.firstChild.textContent=i<Q.length-1?"Далее":"Показать результат";
   nx.firstChild.onclick=function(){if(i<Q.length-1){i++;ask()}else end()};
   n.querySelector("#fb").appendChild(nx);
   if(good)confetti();
   fb.scrollIntoView({behavior:"smooth",block:"nearest"});
  };o.appendChild(b)});
 show(n);
}
function end(){
 var msg=score===Q.length?"Отличный результат! Вы всё верно определили.":score>=Q.length-2?"Хороший результат. Перечитайте пояснения к вопросам, где были ошибки.":"Стоит вернуться к материалам курса и пройти квиз еще раз.";
 var n=el('<div class="card"><div class="mut">Ваш результат</div><div class="big"></div><p></p><div class="row"><button class="btn" id="a">Пройти заново</button></div></div>');
 n.querySelector(".big").textContent=score+" из "+Q.length;n.querySelector("p").textContent=msg;
 n.querySelector("#a").onclick=intro;show(n);
 if(score===Q.length)confetti();
}
intro();
</script>
</body>
</html>
